services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pingdou
      MYSQL_USER: pingdou
      MYSQL_PASSWORD: pingdou_dev
      MYSQL_ROOT_PASSWORD: pingdou_root_dev
    ports:
      - "3306:3306"
    volumes:
      - pingdou-mysqldata:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u pingdou --password=pingdou_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pingdou-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pingdou-minio:/data

volumes:
  pingdou-mysqldata:
  pingdou-redis:
  pingdou-minio:
