services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pingdou
      POSTGRES_USER: pingdou
      POSTGRES_PASSWORD: pingdou_dev
    ports:
      - "5432:5432"
    volumes:
      - pingdou-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingdou"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pingdou-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pingdou-minio:/data

volumes:
  pingdou-pgdata:
  pingdou-redis:
  pingdou-minio:
